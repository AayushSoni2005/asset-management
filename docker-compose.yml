services:
  mysql:
    image: mysql:8.4
    container_name: asset-mysql
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: asset-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - ./backend/.env

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1

    container_name: asset-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  mysql-data: